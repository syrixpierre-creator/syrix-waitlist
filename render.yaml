# Render Blueprint: New > Blueprint > pick this repository.
# MongoDB is not hosted by Render: create a free cluster on MongoDB Atlas and paste its URI as MONGODB_URI.
services:
  - type: web
    name: syrix-waitlist
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: syrix_waitlist
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://syrix.chat
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
